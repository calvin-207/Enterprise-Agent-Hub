name: CI - Django and Vue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Django / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Configure test environment
        run: cp config.py_template config.py
      - name: Python syntax check
        run: python -m compileall -q main system utils apps automation agent_catalog agent_runtime model_gateway tool_gateway tests
      - name: Django system checks
        run: python manage.py check --settings=test_settings
      - name: Verify model migrations are committed
        run: python manage.py makemigrations --check --dry-run --settings=test_settings
      - name: Backend tests with coverage and JUnit
        run: |
          mkdir -p test-results
          pytest -q --junitxml=test-results/pytest.xml --cov=system --cov=utils --cov=apps --cov=agents --cov=agent_runtime --cov=model_gateway --cov=tool_gateway --cov-report=xml:test-results/coverage.xml --cov-report=term-missing
      - name: Celery Redis / worker integration smoke test
        env:
          CELERY_BROKER_URL: redis://127.0.0.1:6379/3
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/4
          # CI 环境标签：API 进程与 Worker 子进程共用，队列名 / 消息头自动匹配。
          HUB_ENV: ci
        run: |
          set -euo pipefail
          python -m celery -A main worker --pool=solo --concurrency=1 --loglevel=WARNING --without-gossip --without-mingle --without-heartbeat > /tmp/eah-celery-worker.log 2>&1 &
          worker_pid=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then cat /tmp/eah-celery-worker.log; fi; kill "$worker_pid" 2>/dev/null || true; exit "$status"' EXIT
          python - <<'PY'
          import os
          import time
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "main.settings")
          import django
          django.setup()
          from django.conf import settings
          from main.celery import app as celery_app
          from system.tasks import ping
          from celery.exceptions import TimeoutError

          # 默认队列必须携带环境标签，Worker 与发布方由此物理隔离。
          assert celery_app.conf.task_default_queue == f"hub-{settings.CELERY_ENV_TAG}", celery_app.conf.task_default_queue
          assert settings.CELERY_ENV_TAG == "ci", settings.CELERY_ENV_TAG

          for attempt in range(5):
              try:
                  result = ping.delay()
                  payload = result.get(timeout=10)
                  assert payload["status"] == "ok", payload
                  assert payload["service"] == "enterprise-agent-hub", payload
                  # 消息与 Worker 同源：环境与版本必须与 API 进程一致。
                  assert payload["env"] == settings.CELERY_ENV_TAG, payload
                  assert payload["version"] == settings.HUB_CODE_VERSION, payload
                  print("Celery worker / Redis broker / result backend OK:", result.id)
                  break
              except TimeoutError:
                  if attempt == 4:
                      raise
                  time.sleep(2)
          PY
      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/test-results/
          retention-days: 14
          if-no-files-found: warn

  frontend:
    name: Frontend / Vitest / Vite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false
      # No committed package-lock.json yet. Use npm install until a lockfile is
      # generated, reviewed and committed, then switch this step to npm ci.
      - name: Install frontend dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Frontend unit tests
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error
